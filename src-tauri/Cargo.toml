[workspace]
members = [".", "core"]

[package]
name = "videoclip"
version = "0.1.0"
description = "VideoClip - 启动录屏逐帧测量耗时"
authors = ["kirin233x"]
edition = "2021"

[lib]
name = "videoclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
videoclip-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
